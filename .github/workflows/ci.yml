name: CI — Build, Test, Type Check

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run --reporter=verbose

      - name: Build
        run: npm run build
        env:
          # Minimal env for build (no real secrets)
          NEXT_PUBLIC_APP_URL: "https://www.modulca.eu"
          NEXT_PUBLIC_APP_NAME: "ModulCA"

      - name: Check bundle size
        run: |
          echo "Build output (total, incl cache):"
          du -sh .next/ 2>/dev/null || echo "Build dir not found"
          echo "Build output (deployment-relevant, excl .next/cache):"
          du -sh --exclude=.next/cache .next/ 2>/dev/null || true
          echo "---"
          # Only the deployment-relevant files are shipped to Vercel.
          # .next/cache/ is build-time scratch (webpack + SWC transforms),
          # typically 1-2GB, not deployed. Measuring it inflates the check.
          # Fail if DEPLOYMENT size exceeds 500MB.
          SIZE=$(du -sm --exclude=.next/cache .next/ 2>/dev/null | cut -f1)
          if [ "$SIZE" -gt 500 ]; then
            echo "::error::Deployment bundle too large: ${SIZE}MB (max 500MB)"
            exit 1
          fi
          echo "Deployment bundle size: ${SIZE}MB — OK"
