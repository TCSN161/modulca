name: Weekly Engine Model Health Check

# Runs every Sunday 07:00 UTC — detects when a provider silently deprecates
# or renames a model we hardcode. Opens / comments on a GitHub Issue labeled
# 'engine-health' when any engine fails or shows deprecated status.

on:
  schedule:
    - cron: "0 7 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run model check
        id: check
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          node scripts/engines-model-check.mjs --json > check-report.json
          EXIT=$?
          echo "exit_code=$EXIT" >> $GITHUB_OUTPUT
          cat check-report.json | node -e "
            const r = JSON.parse(require('fs').readFileSync(0,'utf-8'));
            console.log('OK:', r.ok, '| Failed:', r.failed, '| Deprecated:', r.deprecated);
          "
          exit 0

      - name: Build report
        id: report
        run: |
          node -e "
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('check-report.json','utf-8'));
          const lines = [];
          lines.push('## 🔍 Weekly Engine Model Health');
          lines.push('');
          lines.push(\`Checked: \${r.checkedAt}\`);
          lines.push(\`OK: **\${r.ok}** · Failed: **\${r.failed}** · Deprecated: **\${r.deprecated}**\`);
          lines.push('');
          lines.push('| Engine | Status | Model | Notes |');
          lines.push('|---|---|---|---|');
          for (const e of r.results) {
            const icon = e.status === 'ok' ? '✅' : e.status === 'fail' ? '❌' : '⚠️';
            const dep = e.deprecated ? ' 🔴 DEPRECATED' : '';
            lines.push(\`| \${e.engine} | \${icon}\${dep} | \\\`\${e.currentModel || ''}\\\` | \${e.details.replace(/\\|/g,'\\\\|')} |\`);
            if (e.availableSample?.length) {
              lines.push(\`| | | | Available: \\\`\${e.availableSample.slice(0,3).join('\\\`, \\\`')}\\\` |\`);
            }
          }
          lines.push('');
          lines.push('*Auto-run from .github/workflows/engines-model-check.yml. Local: \`node scripts/engines-model-check.mjs\`*');
          fs.writeFileSync('check-report.md', lines.join('\n'));
          const needs = r.failed > 0 || r.deprecated > 0;
          console.log('needs_attention=' + (needs ? 'true' : 'false'));
          " >> "$GITHUB_OUTPUT"
          cat check-report.md

      - name: Open / update issue
        if: contains(steps.report.outputs.needs_attention, 'true') || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('check-report.md','utf-8');
            const today = new Date().toISOString().slice(0,10);
            const title = `Engine model health — ${today}`;
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'engine-health', per_page: 10,
            });
            const existing = issues.data.find(i => i.title.startsWith('Engine model health'));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['engine-health'],
              });
            }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-model-check-${{ github.run_id }}
          path: |
            check-report.json
            check-report.md
          retention-days: 60
